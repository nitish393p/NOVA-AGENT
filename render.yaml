services:
  - type: web
    name: nova-ai-voice-agent
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: API_KEY_ENCRYPTION_SECRET
        sync: false
